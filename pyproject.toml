[project]
name = "criteo-ctr-lab"
version = "0.1.0"
description = "CTR calibration experiments on the Criteo Kaggle click log"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "polars>=1.0",
    "pyarrow>=16",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctr"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

# CI runs on Linux: take the CPU-only torch wheel instead of the multi-GB CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
