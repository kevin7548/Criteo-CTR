[project]
name = "criteo-ctr-lab"
version = "0.1.0"
description = "CTR calibration experiments on the Criteo Kaggle click log"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
