# Smoke run: the first 5 training shards (~5M rows of block 1) and 2 validation shards.
# Checks the pipeline and narrows the learning rate before the full run (AGENTS.md).
seed = 0
device = "auto"

[model]
name = "lr"

[data]
encoded = "data/encoded"
max_train_shards = 5
max_val_shards = 2
evaluate_test = false

[train]
batch_size = 4096
lr = 0.001
epochs = 3
patience = 1
shards_per_chunk = 5

[output]
artifacts = "artifacts/lr_smoke"
report = "artifacts/lr_smoke/report.json"
